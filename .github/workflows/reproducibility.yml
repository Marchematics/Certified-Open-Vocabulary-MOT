name: reproducibility

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.lock.txt
      - name: Run tests
        env:
          MPLBACKEND: Agg
          PYTHONHASHSEED: "0"
        run: |
          set +e
          PYTHONPATH=code/parc_track python -m pytest -q tests > pytest-output.txt 2>&1
          status=$?
          cat pytest-output.txt
          {
            echo "### Pytest output"
            echo '```text'
            tail -n 240 pytest-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Run tiny certification fixture
        run: PYTHONPATH=code/parc_track python -m parc_track.cli phase9 certification-api --output-dir outputs/tmp_cert_api
      - name: Validate public bundles
        run: |
          python scripts/validate_public_bundle.py outputs/milestones/reliability_fortress
          python scripts/validate_public_bundle.py outputs/milestones/release_story
      - name: Verify manifest
        run: sha256sum -c MANIFEST_SHA256.txt
