name: reproducibility

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.lock.txt
      - name: Run tests
        run: PYTHONPATH=code/parc_track python -m pytest -q tests
      - name: Run tiny certification fixture
        run: PYTHONPATH=code/parc_track python -m parc_track.cli phase9 certification-api --output-dir outputs/tmp_cert_api
      - name: Validate public bundles
        run: |
          python scripts/validate_public_bundle.py outputs/milestones/reliability_fortress
          python scripts/validate_public_bundle.py outputs/milestones/release_story
      - name: Verify manifest
        run: sha256sum -c MANIFEST_SHA256.txt
