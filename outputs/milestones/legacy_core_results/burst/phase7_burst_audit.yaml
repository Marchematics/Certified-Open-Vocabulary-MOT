dataset:
  name: BURST
  root: <PARC_ROOT>/data/BURST
  ann_file: <PARC_ROOT>/outputs/phase7_third_dataset/burst_val_box_annotations.json
  format_hint: burst_box
  frame_subdir: ""

proposal:
  backbone: groundingdino_audit_generator
  max_videos: 988
  frames_per_video: 8
  classes_per_video: 3
  max_paths_per_video: 200
  candidate_budget_M: 5000
  min_path_length: 2
  link_iou_threshold: 0.15
  max_frame_gap: 1000
  max_detections_per_frame: 30
  progress_every: 25
  cache_dir: <PARC_ROOT>/outputs/phase7_burst/cache

groundingdino:
  config: <DATASETS_ROOT>/ComfyUI/models/grounding-dino/GroundingDINO_SwinT_OGC.cfg.py
  weights: <DATASETS_ROOT>/ComfyUI/models/grounding-dino/groundingdino_swint_ogc.pth
  local_text_encoder: <PARC_ROOT>/cache/huggingface/manual/bert-base-uncased
  device: cuda:0
  text_threshold: 0.25
  box_threshold: 0.30

matching:
  iou_threshold: 0.5
  temporal_overlap_threshold: 0.3
  unmatched_only: true

sampling:
  strategy: stratified_by_mondrian_cell
  total_samples: 200
  top_b_per_cell: 10
  min_score_percentile: 80

mondrian:
  use_novelty: true
  use_query_cluster: true
  use_occlusion: true
  use_domain: false
  fallback_min_videos: 100

audit_export:
  make_montages: true
  frames_per_path: 8
  output_viewer: <PARC_ROOT>/outputs/phase7_burst/audit_viewer
  montage_dir: <PARC_ROOT>/outputs/phase7_burst/audit_viewer/montages
  clip_dir: <PARC_ROOT>/outputs/phase7_burst/audit_viewer/clips

output:
  candidates: <PARC_ROOT>/outputs/phase7_burst/audit_candidates.csv
  labels: <PARC_ROOT>/outputs/phase7_burst/audit_labels.csv
  manifest: <PARC_ROOT>/outputs/phase7_burst/audit_manifest.json
  summary: <PARC_ROOT>/outputs/phase7_burst/audit_summary.csv
  candidate_universe: <PARC_ROOT>/outputs/phase7_burst/candidate_universe.csv
  candidate_scores: <PARC_ROOT>/outputs/phase7_burst/candidate_scores.csv
  candidate_nodes: <PARC_ROOT>/outputs/phase7_burst/candidate_nodes.csv
