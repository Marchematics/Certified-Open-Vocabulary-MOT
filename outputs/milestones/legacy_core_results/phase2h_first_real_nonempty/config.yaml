dataset:
  name: OVT-B
  root: <PARC_ROOT>/data/OVT-B
  ann_file: <PARC_ROOT>/data/OVT-B/ovtb_ann.json
  format_hint: tao_or_coco_video

splits:
  tune_ratio: 0.10
  cal_ratio: 0.50
  test_ratio: 0.40
  seed: 0

risk:
  alpha1: 0.10

release_grid:
  times_sec: [2.0]
  weights: uniform

calibration:
  empty_block_policy: coverage_conditional
  use_verified_positive_for_calibration: true

e_calibrator:
  type: power
  gamma_selection: effective_finite_resolution_tuned
  gamma_candidates: [0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.50]

selector:
  type: uniform_scs_greedy
  candidate_budget_sweep: [25, 50, 100, 150, 200, 250]

high_e_diagnostics:
  candidate_budget_sweep: [25, 50, 100, 150, 200, 250]
  gamma_candidates: [0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.50]

input:
  candidate_universe: <PARC_ROOT>/outputs/phase2_1000/candidate_universe.csv
  audit_labels: <PARC_ROOT>/outputs/phase2/audit_labels.csv

output:
  summary: <PARC_ROOT>/outputs/phase2_1000/real_cert_1000_small_summary.json
  real_cert_summary: <PARC_ROOT>/outputs/phase2_1000/real_cert_1000_small_summary.csv
  candidate_evalues: <PARC_ROOT>/outputs/phase2_1000/candidate_evalues_1000_small.csv
  cell_effective_n: <PARC_ROOT>/outputs/phase2_1000/cell_effective_n_1000_small.csv
  per_video_candidate_coverage: <PARC_ROOT>/outputs/phase2_1000/per_video_candidate_coverage_1000_small.csv
  high_e_mass_diagnostics: <PARC_ROOT>/outputs/phase2_1000/high_e_mass_diagnostics_small.csv
  gamma_mass_sweep: <PARC_ROOT>/outputs/phase2_1000/gamma_mass_sweep_small.csv
