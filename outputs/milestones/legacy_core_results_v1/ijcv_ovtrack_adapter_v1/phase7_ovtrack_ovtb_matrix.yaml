dataset:
  name: OVT-B
  root: <PARC_ROOT>/data/OVT-B
  ann_file: <PARC_ROOT>/data/OVT-B/ovtb_ann.json
  format_hint: tao_or_coco_video
splits:
  tune_ratio: 0.1
  cal_ratio: 0.5
  test_ratio: 0.4
  seed: 0
risk:
  alpha1: 0.1
release_grid:
  times_sec:
  - 2.0
  weights: uniform
calibration:
  empty_block_policy: coverage_conditional
  use_verified_positive_for_calibration: true
e_calibrator:
  type: power
  gamma_selection: effective_finite_resolution_tuned
  gamma_candidates:
  - 0.1
  - 0.15
  - 0.2
  - 0.25
  - 0.3
  - 0.35
  - 0.5
selector:
  type: uniform_scs_greedy
  candidate_budget_sweep:
  - 150
matrix:
  alpha1:
  - 0.1
  - 0.2
  seeds:
  - 0
  - 1
  - 2
  candidate_budget_M:
  - 150
tune_selection:
  internal_cal_ratio: 0.5
  fallback_M: 150
  out: <PARC_ROOT>/outputs/phase7_ovtrack_ovtb/tuned_m_selection.csv
input:
  candidate_universe: <PARC_ROOT>/outputs/phase7_ovtrack_ovtb/candidate_universe.csv
  audit_labels: <PARC_ROOT>/outputs/phase7_ovtrack_ovtb/audit_labels.csv
output:
  output_dir: <PARC_ROOT>/outputs/phase7_ovtrack_ovtb
  candidate_nodes: <PARC_ROOT>/outputs/phase7_ovtrack_ovtb/candidate_nodes.csv
