[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "parc-track"
version = "0.1.0"
description = "PARC-Track smoke framework for certified open-vocabulary MOT under partial annotations."
requires-python = ">=3.10"
dependencies = [
  "matplotlib",
  "numpy",
  "pandas",
  "PyYAML",
  "Jinja2",
  "tqdm",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
parc-track = "parc_track.cli:main"

[tool.setuptools.packages.find]
where = ["."]
