dataset:
  name: TAO
  root: ./data/TAO
  ann_file: ./data/TAO/annotations/trainval.json
  format_hint: tao
splits:
  tune_ratio: 0.1
  cal_ratio: 0.5
  test_ratio: 0.4
  seed: 0
  strategy: severe_sparse_annotation_shift
risk:
  alpha1: 0.1
release_grid:
  times_sec:
  - 2.0
  weights: uniform
calibration:
  empty_block_policy: coverage_conditional
  use_verified_positive_for_calibration: true
e_calibrator:
  type: power
  gamma_selection: effective_finite_resolution_tuned
  gamma_candidates:
  - 0.1
  - 0.15
  - 0.2
  - 0.25
  - 0.3
  - 0.35
  - 0.5
selector:
  type: uniform_scs_greedy
  candidate_budget_sweep:
  - 150
matrix:
  alpha1:
  - 0.1
  - 0.2
  seeds:
  - 0
  - 1
  - 2
  candidate_budget_M:
  - 150
input:
  candidate_universe: ./outputs/phase3_tao_full/candidate_universe.csv
  audit_labels: ./outputs/phase10_nonexchangeability/tao_final_human_labels.csv
output:
  output_dir: ./outputs/phase10_nonexchangeability/tao_severe_sparse_annotation_shift
  candidate_nodes: ./outputs/phase3_tao_full/candidate_nodes.csv
