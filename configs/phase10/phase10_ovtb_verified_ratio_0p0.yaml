dataset:
  name: OVT-B
  root: ./data/OVT-B
  ann_file: ./data/OVT-B/ovtb_ann.json
  format_hint: tao_or_coco_video
splits:
  tune_ratio: 0.1
  cal_ratio: 0.5
  test_ratio: 0.4
  seed: 0
  strategy: random
risk:
  alpha1: 0.1
release_grid:
  times_sec:
  - 2.0
  weights: uniform
calibration:
  empty_block_policy: coverage_conditional
  use_verified_positive_for_calibration: true
e_calibrator:
  type: power
  gamma_selection: effective_finite_resolution_tuned
  gamma_candidates:
  - 0.1
  - 0.15
  - 0.2
  - 0.25
  - 0.3
  - 0.35
  - 0.5
selector:
  type: uniform_scs_greedy
  candidate_budget_sweep:
  - 150
matrix:
  alpha1:
  - 0.1
  - 0.2
  seeds:
  - 0
  - 1
  - 2
  candidate_budget_M:
  - 150
input:
  candidate_universe: ./outputs/phase2_full/candidate_universe.csv
  audit_labels: ./outputs/phase10_null_inflation/ovtb_verified_ratio_0p0_labels.csv
output:
  output_dir: ./outputs/phase10_null_inflation/ovtb_verified_ratio_0p0
  candidate_nodes: ./outputs/phase2_full/candidate_nodes.csv
