dataset:
  name: OVT-B
  root: ./data/OVT-B
  ann_file: ./data/OVT-B/ovtb_ann.json
  format_hint: tao_or_coco_video

splits:
  tune_ratio: 0.10
  cal_ratio: 0.50
  test_ratio: 0.40
  seed: 0

risk:
  alpha1: 0.10

release_grid:
  times_sec: [2.0]
  weights: uniform

calibration:
  empty_block_policy: coverage_conditional
  use_verified_positive_for_calibration: true

e_calibrator:
  type: power
  gamma_selection: effective_finite_resolution_tuned
  gamma_candidates: [0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.50]

selector:
  type: uniform_scs_greedy
  candidate_budget_sweep: [10, 25, 50, 75, 100, 125, 150]

matrix:
  alpha1: [0.10, 0.20]
  seeds: [0, 1, 2]
  candidate_budget_M: [10, 25, 50, 75, 100, 125, 150]

tune_selection:
  internal_cal_ratio: 0.50
  fallback_M: 150
  out: ./outputs/phase3_ovtb_owlv2_smallM/tuned_m_selection.csv

input:
  candidate_universe: ./outputs/phase3_ovtb_owlv2/candidate_universe.csv
  audit_labels: ./outputs/phase3_ovtb_owlv2/audit_labels.csv

release_audit:
  method: parc_track_gamma_tuned_uniform_scs
  candidate_budget_M: 150
  alpha1: [0.10, 0.20]
  seeds: [0, 1, 2]
  out: ./outputs/phase3_ovtb_owlv2_smallM/release_audit_owlv2_ovtb_fixed_M150_unsupported.csv
  labels_out: ./outputs/phase3_ovtb_owlv2_smallM/release_audit_owlv2_ovtb_fixed_M150_unsupported_labels.csv

output:
  output_dir: ./outputs/phase3_ovtb_owlv2_smallM
  candidate_nodes: ./outputs/phase3_ovtb_owlv2/candidate_nodes.csv
