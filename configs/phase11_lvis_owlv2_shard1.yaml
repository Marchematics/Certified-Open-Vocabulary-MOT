dataset:
  name: LVIS
  root: ${PARC_RAW_DATA_ROOT}/COCO
  ann_file: ${PARC_RAW_DATA_ROOT}/LVIS/lvis_pseudo_tracking_ann.json
  format_hint: lvis_pseudo_tracking
  frame_subdir: ''
proposal:
  backend: owlv2_hf
  backbone: owlv2_hf
  max_videos: 50000
  frames_per_video: 1
  classes_per_video: 3
  max_paths_per_video: 200
  candidate_budget_M: 5000
  min_path_length: 1
  link_iou_threshold: 0.0
  max_frame_gap: 0
  max_detections_per_frame: 30
  video_stride: 4
  video_offset: 1
  progress_every: 250
  cache_dir: ${PARC_TRACK_ROOT}/outputs/phase11_nmi/lvis_detection/owlv2/shard_1/cache
matching:
  iou_threshold: 0.5
  temporal_overlap_threshold: 0.5
  unmatched_only: true
sampling:
  strategy: stratified_by_mondrian_cell
  total_samples: 500
  top_b_per_cell: 15
  min_score_percentile: 80
mondrian:
  use_novelty: true
  use_query_cluster: true
  use_occlusion: false
  use_domain: false
  fallback_min_videos: 100
audit_export:
  make_montages: false
  frames_per_path: 1
  output_viewer: ${PARC_TRACK_ROOT}/outputs/phase11_nmi/lvis_detection/owlv2/shard_1/audit_viewer
  montage_dir: ${PARC_TRACK_ROOT}/outputs/phase11_nmi/lvis_detection/owlv2/shard_1/audit_viewer/montages
  clip_dir: ${PARC_TRACK_ROOT}/outputs/phase11_nmi/lvis_detection/owlv2/shard_1/audit_viewer/clips
output:
  candidates: ${PARC_TRACK_ROOT}/outputs/phase11_nmi/lvis_detection/owlv2/shard_1/audit_candidates.csv
  labels: ${PARC_TRACK_ROOT}/outputs/phase11_nmi/lvis_detection/owlv2/shard_1/audit_labels.csv
  manifest: ${PARC_TRACK_ROOT}/outputs/phase11_nmi/lvis_detection/owlv2/shard_1/audit_manifest.json
  summary: ${PARC_TRACK_ROOT}/outputs/phase11_nmi/lvis_detection/owlv2/shard_1/audit_summary.csv
  candidate_universe: ${PARC_TRACK_ROOT}/outputs/phase11_nmi/lvis_detection/owlv2/shard_1/candidate_universe.csv
  candidate_scores: ${PARC_TRACK_ROOT}/outputs/phase11_nmi/lvis_detection/owlv2/shard_1/candidate_scores.csv
  candidate_nodes: ${PARC_TRACK_ROOT}/outputs/phase11_nmi/lvis_detection/owlv2/shard_1/candidate_nodes.csv
owlv2:
  model: google/owlv2-base-patch16-ensemble
  device: cuda:0
  cache_dir: ${PARC_TRACK_ROOT}/cache/huggingface
  threshold: 0.1
  max_detections_per_class: 10
