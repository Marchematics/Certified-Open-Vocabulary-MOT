dataset:
  name: OVT-B
  root: ./data/OVT-B
  ann_file: ./data/OVT-B/ovtb_ann.json
  format_hint: tao_or_coco_video

splits:
  tune_ratio: 0.10
  cal_ratio: 0.50
  test_ratio: 0.40
  seed: 0

risk:
  alpha1: 0.10

release_grid:
  times_sec: [1.0, 2.0]
  weights: uniform

calibration:
  empty_block_policy: coverage_conditional
  use_verified_positive_for_calibration: true

e_calibrator:
  type: power
  gamma_selection: effective_finite_resolution_tuned
  gamma_candidates: [0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.50]

selector:
  type: uniform_scs_greedy
  candidate_budget_sweep: [250, 500, 1000, 2000]

coverage_sweep:
  processed_videos: [500, 1000, 1973]
  cal_ratios: [0.50, 0.60]
  release_grids:
    - [2.0]
    - [1.0, 2.0]
  empty_block_policy:
    - conservative_infinity
    - coverage_conditional
  projection_baseline: ./outputs/phase2/coverage_sweep.csv

input:
  candidate_universe: ./outputs/phase2_500/candidate_universe.csv
  audit_labels: ./outputs/phase2/audit_labels.csv

output:
  summary: ./outputs/phase2_500/real_cert_500_two_summary.json
  real_cert_summary: ./outputs/phase2_500/real_cert_500_two_summary.csv
  candidate_evalues: ./outputs/phase2_500/candidate_evalues_500_two.csv
  cell_effective_n: ./outputs/phase2_500/cell_effective_n_500_two.csv
  per_video_candidate_coverage: ./outputs/phase2_500/per_video_candidate_coverage_500_two.csv
  coverage_sweep: ./outputs/phase2_500/coverage_sweep_500_two.csv
  projection_vs_observed: ./outputs/phase2_500/coverage_projection_check_500_two.csv
