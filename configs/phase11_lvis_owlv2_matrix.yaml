dataset:
  name: LVIS
splits:
  tune_ratio: 0.1
  cal_ratio: 0.5
  test_ratio: 0.4
  seed: 0
risk:
  alpha1: 0.1
release_grid:
  times_sec:
  - 2.0
  weights: uniform
calibration:
  type: null_superset_block
  empty_block_policy: coverage_conditional
  use_verified_positive_for_calibration: true
  fallback: global_first
e_calibrator:
  type: power
  gamma_selection: effective_finite_resolution_tuned
  gamma_candidates:
  - 0.1
  - 0.15
  - 0.2
  - 0.25
  - 0.3
  - 0.35
  - 0.5
selector:
  type: uniform_scs_greedy
  candidate_budget_sweep:
  - 150
matrix:
  alpha1:
  - 0.1
  - 0.2
  seeds:
  - 0
  - 1
  - 2
  candidate_budget_M:
  - 150
input:
  candidate_universe: ${PARC_TRACK_ROOT}/outputs/phase11_nmi/lvis_detection/owlv2/candidate_universe.csv
  audit_labels: ${PARC_TRACK_ROOT}/outputs/phase11_nmi/lvis_detection/owlv2/audit_labels.csv
output:
  output_dir: ${PARC_TRACK_ROOT}/outputs/phase11_nmi/lvis_detection/owlv2/matrix
  candidate_nodes: ${PARC_TRACK_ROOT}/outputs/phase11_nmi/lvis_detection/owlv2/candidate_nodes.csv
reporting:
  generator: OWLv2
  scope: lvis_detection_length1
