dataset:
  name: OVT-B
  root: ./data/OVT-B
  ann_file: ./data/OVT-B/ovtb_ann.json
  format_hint: tao_or_coco_video

splits:
  tune_ratio: 0.10
  cal_ratio: 0.60
  test_ratio: 0.30
  seed: 0

risk:
  alpha1: 0.10

release_grid:
  times_sec: [1.0, 2.0]
  weights: uniform

calibration:
  empty_block_policy: coverage_conditional
  use_verified_positive_for_calibration: true

e_calibrator:
  type: power
  gamma_selection: effective_finite_resolution_tuned

selector:
  type: uniform_scs_greedy
  candidate_budget_sweep: [250, 500, 1000, 2000]

input:
  candidate_universe: ./outputs/phase2/candidate_universe.csv
  audit_labels: ./outputs/phase2/audit_labels.csv

output:
  summary: ./outputs/phase2/real_certify_recovery_summary.json
  real_cert_summary: ./outputs/phase2/real_cert_recovery_summary.csv
  candidate_evalues: ./outputs/phase2/candidate_evalues_recovery.csv
  cell_effective_n: ./outputs/phase2/cell_effective_n_recovery.csv
  per_video_candidate_coverage: ./outputs/phase2/per_video_candidate_coverage_recovery.csv
  coverage_sweep: ./outputs/phase2/coverage_sweep_recovery.csv
