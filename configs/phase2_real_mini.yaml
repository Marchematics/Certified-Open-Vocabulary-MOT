dataset:
  name: OVT-B
  root: /home/waas/paper_experiments/data/OVT-B
  ann_file: /home/waas/paper_experiments/data/OVT-B/ovtb_ann.json
  format_hint: tao_or_coco_video

splits:
  tune_ratio: 0.15
  cal_ratio: 0.35
  test_ratio: 0.50
  seed: 0

risk:
  alpha1: 0.10

release_grid:
  times_sec: [0.5, 1.0, 2.0, 4.0, 8.0]
  weights: uniform

e_calibrator:
  type: power
  gamma_selection: finite_resolution_tuned
  gamma_candidates: [0.15, 0.20, 0.25, 0.35, 0.50, 0.65, 0.80]

selector:
  type: uniform_scs_greedy
  candidate_budget_M: 5000

calibration:
  type: null_superset_block
  use_verified_positive_audit: true
  fallback_min_videos: 100

proposal:
  cache_dir: /home/waas/paper_experiments/outputs/phase2/cache

output:
  summary: /home/waas/paper_experiments/outputs/phase2/real_mini_summary.json
  cell_effective_n: /home/waas/paper_experiments/outputs/phase2/cell_effective_n.csv
  real_cert_summary: /home/waas/paper_experiments/outputs/phase2/real_cert_summary.csv
