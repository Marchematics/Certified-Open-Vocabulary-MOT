dataset:
  name: OVIS
  root: ./data/OVT-B
  ann_file: ./outputs/phase12_ovis/ovis_ovtb_ann.json
  format_hint: tao_or_coco_video
  frame_subdir: OVT-B

proposal:
  backbone: groundingdino_audit_generator
  max_videos: 20
  frames_per_video: 8
  classes_per_video: 3
  max_paths_per_video: 200
  candidate_budget_M: 5000
  min_path_length: 2
  link_iou_threshold: 0.15
  max_frame_gap: 1000
  max_detections_per_frame: 30
  progress_every: 5
  cache_dir: ./outputs/phase12_ovis/cache

groundingdino:
  config: /datasets/ComfyUI/models/grounding-dino/GroundingDINO_SwinT_OGC.cfg.py
  weights: /datasets/ComfyUI/models/grounding-dino/groundingdino_swint_ogc.pth
  local_text_encoder: ./cache/huggingface/manual/bert-base-uncased
  device: cuda:0
  text_threshold: 0.25
  box_threshold: 0.30

matching:
  iou_threshold: 0.5
  temporal_overlap_threshold: 0.3
  unmatched_only: true

sampling:
  strategy: stratified_by_mondrian_cell
  total_samples: 100
  top_b_per_cell: 10
  min_score_percentile: 80

mondrian:
  use_novelty: true
  use_query_cluster: true
  use_occlusion: true
  use_domain: false
  fallback_min_videos: 20

audit_export:
  make_montages: true
  frames_per_path: 8
  output_viewer: ./outputs/phase12_ovis/audit_viewer
  montage_dir: ./outputs/phase12_ovis/audit_viewer/montages
  clip_dir: ./outputs/phase12_ovis/audit_viewer/clips

output:
  candidates: ./outputs/phase12_ovis/audit_candidates.csv
  labels: ./outputs/phase12_ovis/audit_labels.csv
  manifest: ./outputs/phase12_ovis/audit_manifest.json
  summary: ./outputs/phase12_ovis/audit_summary.csv
  candidate_universe: ./outputs/phase12_ovis/candidate_universe.csv
  candidate_scores: ./outputs/phase12_ovis/candidate_scores.csv
  candidate_nodes: ./outputs/phase12_ovis/candidate_nodes.csv
