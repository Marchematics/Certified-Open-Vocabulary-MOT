dataset:
  name: OVT-B
  root: /home/waas/paper_experiments/data/OVT-B
  ann_file: /home/waas/paper_experiments/data/OVT-B/ovtb_ann.json
  format_hint: tao_or_coco_video

splits:
  tune_ratio: 0.10
  cal_ratio: 0.50
  test_ratio: 0.40
  seed: 0

risk:
  alpha1: 0.10

release_grid:
  times_sec: [2.0]
  weights: uniform

calibration:
  empty_block_policy: coverage_conditional
  use_verified_positive_for_calibration: true

e_calibrator:
  type: power
  gamma_selection: effective_finite_resolution_tuned
  gamma_candidates: [0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.50]

selector:
  type: uniform_scs_greedy
  candidate_budget_sweep: [250, 500, 1000, 2000]

high_e_diagnostics:
  candidate_budget_sweep: [25, 50, 100, 150, 200, 250, 500, 1000]
  gamma_candidates: [0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.50]

coverage_sweep:
  processed_videos: [1000, 1973]
  cal_ratios: [0.50, 0.60]
  release_grids:
    - [2.0]
    - [1.0, 2.0]
  empty_block_policy:
    - conservative_infinity
    - coverage_conditional
  projection_baseline: /home/waas/paper_experiments/outputs/phase2_500/coverage_sweep_500_single.csv

input:
  candidate_universe: /home/waas/paper_experiments/outputs/phase2_1000/candidate_universe.csv
  audit_labels: /home/waas/paper_experiments/outputs/phase2/audit_labels.csv

output:
  summary: /home/waas/paper_experiments/outputs/phase2_1000/real_cert_1000_single_summary.json
  real_cert_summary: /home/waas/paper_experiments/outputs/phase2_1000/real_cert_1000_single_summary.csv
  candidate_evalues: /home/waas/paper_experiments/outputs/phase2_1000/candidate_evalues_1000_single.csv
  cell_effective_n: /home/waas/paper_experiments/outputs/phase2_1000/cell_effective_n_1000_single.csv
  per_video_candidate_coverage: /home/waas/paper_experiments/outputs/phase2_1000/per_video_candidate_coverage_1000_single.csv
  coverage_sweep: /home/waas/paper_experiments/outputs/phase2_1000/coverage_sweep_1000_single.csv
  projection_vs_observed: /home/waas/paper_experiments/outputs/phase2_1000/coverage_projection_check_1000_single.csv
  high_e_mass_diagnostics: /home/waas/paper_experiments/outputs/phase2_1000/high_e_mass_diagnostics.csv
  gamma_mass_sweep: /home/waas/paper_experiments/outputs/phase2_1000/gamma_mass_sweep.csv
