dataset:
  name: TAO
  root: /home/waas/paper_experiments/data/TAO
  ann_file: /home/waas/paper_experiments/data/TAO/annotations/trainval.json
  format_hint: tao
  frame_subdir: ""

proposal:
  backend: owlvit_hf
  backbone: owlvit_hf
  max_videos: 100
  frames_per_video: 4
  classes_per_video: 2
  max_paths_per_video: 200
  candidate_budget_M: 5000
  min_path_length: 1
  link_iou_threshold: 0.15
  max_frame_gap: 1000
  max_detections_per_frame: 20
  cache_dir: /home/waas/paper_experiments/outputs/phase4_tao_owlvit_v1/cache
  progress_every: 10

owlvit:
  model: google/owlvit-base-patch32
  device: cuda:0
  cache_dir: /home/waas/paper_experiments/cache/huggingface
  local_files_only: false
  threshold: 0.08
  text_template: a photo of a {query}

matching:
  iou_threshold: 0.5
  temporal_overlap_threshold: 0.3
  unmatched_only: true

sampling:
  strategy: stratified_by_mondrian_cell
  total_samples: 300
  top_b_per_cell: 10
  min_score_percentile: 80

mondrian:
  use_novelty: true
  use_query_cluster: true
  use_occlusion: true
  use_domain: false
  fallback_min_videos: 100

audit_export:
  make_montages: false
  frames_per_path: 8
  output_viewer: /home/waas/paper_experiments/outputs/phase4_tao_owlvit_v1/audit_viewer
  montage_dir: /home/waas/paper_experiments/outputs/phase4_tao_owlvit_v1/audit_viewer/montages
  clip_dir: /home/waas/paper_experiments/outputs/phase4_tao_owlvit_v1/audit_viewer/clips

output:
  candidates: /home/waas/paper_experiments/outputs/phase4_tao_owlvit_v1/audit_candidates.csv
  labels: /home/waas/paper_experiments/outputs/phase4_tao_owlvit_v1/audit_labels.csv
  manifest: /home/waas/paper_experiments/outputs/phase4_tao_owlvit_v1/audit_manifest.json
  summary: /home/waas/paper_experiments/outputs/phase4_tao_owlvit_v1/audit_summary.csv
  candidate_universe: /home/waas/paper_experiments/outputs/phase4_tao_owlvit_v1/candidate_universe.csv
  candidate_scores: /home/waas/paper_experiments/outputs/phase4_tao_owlvit_v1/candidate_scores.csv
  candidate_nodes: /home/waas/paper_experiments/outputs/phase4_tao_owlvit_v1/candidate_nodes.csv
